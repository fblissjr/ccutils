<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {# Hash-pinned inline blocks -- see session.html and _build_csp. #}
    <meta http-equiv="Content-Security-Policy" content="{{ csp|safe }}">
    <title>Claude Code sessions</title>
    <style>{{ style|safe }}</style>
</head>
<body>
<main>
    <header class="session-header">
        <h1>Claude Code sessions</h1>
        <p class="session-meta">{{ session_count }} sessions across {{ project_count }} projects{% if date_range %} &middot; {{ date_range }}{% endif %}</p>
        <div class="filter-bar">
            <input id="q" type="search" placeholder="Filter by project, title, or prompt&hellip;" autocomplete="off">
            <span class="filter-count" id="shown"></span>
        </div>
    </header>

    <section id="messages">
        {{ cards_html|safe }}
        <p class="no-match hidden" id="no-match">No session matches that filter.</p>
    </section>
</main>
<script>{{ script|safe }}</script>
</body>
</html>
