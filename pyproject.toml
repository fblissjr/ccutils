[project]
name = "ccutils"
version = "0.18.0"
description = "Claude Code transcript analytics: HTML/markdown transcripts and a DuckDB star-schema warehouse with full ETL lineage"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "fblissjr" }
]
maintainers = [
    { name = "fblissjr" }
]
requires-python = ">=3.10"
dependencies = [
    "click",
    "click-default-group",
    "click-option-group>=0.5.9",
    "duckdb",
    "httpx",
    "jinja2",
    "markdown",
    "nh3>=0.3.4",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.2",
    "questionary",
    "rich>=14.3.2",
]

[project.urls]
Homepage = "https://github.com/fblissjr/ccutils"

[project.scripts]
ccutils = "ccutils:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project.optional-dependencies]
colbert = ["pylate"]
explore = ["harlequin"]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pytest>=9.0.2",
    "pytest-httpx>=0.35.0",
    "syrupy>=5.0.0",
]
