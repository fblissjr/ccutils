[project]
name = "ccutils"
version = "0.19.2"
description = "Claude Code transcript analytics: HTML/markdown transcripts and a DuckDB star-schema warehouse with full ETL lineage"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "fblissjr" }
]
maintainers = [
    { name = "fblissjr" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.8",
    "click-default-group>=1.2.4",
    "click-option-group>=0.5.9",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.0",
    "nh3>=0.3.4",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.2",
    "questionary>=2.1.1",
    "rich>=14.3.2",
]

[project.urls]
Homepage = "https://github.com/fblissjr/ccutils"

[project.scripts]
ccutils = "ccutils:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project.optional-dependencies]
colbert = ["pylate"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-httpx>=0.35.0",
]
